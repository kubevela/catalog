name: Addon docs generator
on:
  pull_request:
    paths:
      - hack/addon-docs/**
      - .github/workflows/addon-docs.yaml
  push:
    branches:
      - master
    paths:
      - hack/addon-docs/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.27.1
          cache-dependency-path: hack/addon-docs/go.sum

      - name: Test
        working-directory: hack/addon-docs
        run: |
          go vet ./...
          go test ./...
