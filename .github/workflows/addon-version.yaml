name: Addon-version

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  version-bump:
    name: Version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test the release scripts
        run: hack/addon-release/test.sh

      - name: Check each changed addon has a new version
        run: hack/addon-release/check-version-bump.sh "origin/${{ github.base_ref }}"
