name: Publish Registry to Github Page
on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  build-and-publish:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      URL: https://kubevela.github.io/catalog
      GO_VERSION: 1.27.1
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Test the registry tooling
        run: go test ./hack/addons/registry/

      - name: package-addon-gen-index
        run: |
          cd ./addons/
          go run ../hack/addons/syn_addon_package.go ./ ${{ env.URL }}/official
          ls ./
          cat ./index.yaml
          mkdir -p ../docs/official
          mv ./index.yaml ../docs/official/
          mv ./*.tgz ../docs/official/

      - name: package-addon-gen-index-experimental
        run: |
          cd ./experimental/addons/
          go run ../../hack/addons/syn_addon_package.go ./ ${{ env.URL }}/experimental
          ls ./
          cat ./index.yaml
          mkdir -p ../../docs/experimental
          mv ./index.yaml ../../docs/experimental/
          mv ./*.tgz ../../docs/experimental/

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  tag-releases:
    # Tags each newly published addon version as release/<addon>/<version>, once the registry is live.
    needs: build-and-publish
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Tag new addon versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          hack/addon-release/tag.sh

  docs:
    # One publish at a time, oldest first, so an older run never overwrites newer pages.
    concurrency:
      group: addon-docs-publish
      cancel-in-progress: false
    # Generates the addon pages for the KubeVela docs site from every published version, once the new ones are
    # tagged, pushes them to the docs-site branch and asks the site to rebuild.
    needs: tag-releases
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the release tags
        run: git fetch --tags --force origin

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.27.1
          cache-dependency-path: hack/addon-docs/go.sum

      - name: Build on KubeVela's newest release
        # Detected from kubevela/kubevela's tags, so a KubeVela release reaches the pages without a commit here.
        run: hack/addon-docs/pin-kubevela.sh

      - name: Generate and push the docs-site branch
        run: hack/addon-docs/publish.sh

      - name: Ask the docs site to rebuild
        env:
          TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          # The site also rebuilds every 3 hours, so without the token the pages arrive then.
          if [ -z "$TOKEN" ]; then
            echo "No DOCS_DISPATCH_TOKEN; the docs site picks the pages up on its next build."
            exit 0
          fi
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kubevela/kubevela.github.io/dispatches \
            -d '{"event_type":"addon-docs"}'
