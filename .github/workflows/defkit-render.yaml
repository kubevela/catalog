name: DefKit render image

on:
  push:
    branches: [master]
    paths:
      - "experimental/addons/defkit/render/**"
      - ".github/workflows/defkit-render.yaml"
    tags:
      - "defkit-render-v*"
  pull_request:
    branches: [master]
    paths:
      - "experimental/addons/defkit/render/**"
      - ".github/workflows/defkit-render.yaml"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/kubevela/defkit-render
  CONTEXT: experimental/addons/defkit/render

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.CONTEXT }}/go.mod
          cache-dependency-path: ${{ env.CONTEXT }}/go.sum

      - name: Test
        working-directory: ${{ env.CONTEXT }}
        run: |
          go vet ./...
          go test ./...

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # A defkit-render-vX.Y.Z tag publishes vX.Y.Z; every build is also tagged sha-<short sha>.
          tags: |
            type=match,pattern=defkit-render-(v.*),group=1
            type=sha,format=short

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
