apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: cloudshell
  namespace: vela-system
spec:
  components:
    - name: cloudshell-operator
      type: helmchart
      properties:
        chart:
          source: cloudtty
          repoURL: https://cloudtty.github.io/cloudtty
          version: "0.5.0"
        release:
          name: cloudshell-operator
          namespace: vela-system
        values:
          # The chart's own operator: the chart and the operator move together,
          # since the chart's job template needs fields the operator renders.
          image:
            registry: ghcr.io
            repository: cloudtty/cloudshell-operator
            tag: "v0.5.0"
          jobTemplate:
            image:
              registry: docker.io
              repository: oamdev/cloudshell
              tag: "v1.7.2"
