# The KubeVela releases the addon docs cover. Update on every KubeVela minor release.
#
# current: the newest KubeVela minor the docs site documents. Every addon's latest version is for it.
# currentReleased: whether current has its v1.X.0 tag; until then the pages call it Next, as the site does.
# oldest: the oldest minor with addon pages; an addon version only for older ones gets none.
# minors: each released minor and the date of its v1.X.0 tag, which decides which minors an addon version was for.
current: "1.12"
currentReleased: false
oldest: "1.9"
minors:
