# Each addon's category, and a logo where its metadata.yaml has none or a stale one, until metadata.yaml carries
# them. A logo here wins over the metadata's icon: CNCF artwork, or the project's GitHub organisation avatar, which
# the project keeps current. An addon's category must be one of `categories`; the site lists KubeVela first, then the
# rest by name, and an addon with none under Other.
